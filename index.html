<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1311" media="(prefers-color-scheme: dark)">
<title>Gimnasio</title>
<style>
/* Concepto: app de mano en el gimnasio. Una columna, tarjeta protagonista en grafito,
   números grandes y redondeados para cargar rápido, verde bosque como único acento. */
:root {
  --fondo: #f1f0ec; --tarjeta: #ffffff; --tarjeta-2: #f6f5f1; --texto: #161a17; --suave: #5b625d; --tenue: #8a908b; --linea: #e2e0da;
  --acento: #1e6b4b; --acento-fuerte: #165a3d; --acento-texto: #ffffff; --acento-suave: #e0ede5;
  --grafito: #1b201d; --grafito-2: #262c28; --grafito-texto: #f1f2ee; --grafito-suave: #a9b1ab; --menta: #8fd3ad; --menta-texto: #0b1610;
  --arena: #eee7d8; --arena-texto: #6a5735;
  --alerta: #a8372b; --alerta-suave: #f6e1dd; --ok: #1e6b4b;
  --sombra: 0 1px 2px rgba(20, 26, 22, .05), 0 10px 28px -16px rgba(20, 26, 22, .22);
  --vidrio: rgba(241, 240, 236, .86);
  --f-texto: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --f-num: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 18px; --r-chico: 12px;
  --t: 180ms cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fondo: #0f1311; --tarjeta: #181d1a; --tarjeta-2: #1f2522; --texto: #eef0ec; --suave: #a3aba5; --tenue: #747c76; --linea: #2a312d;
    --acento: #5fbf8f; --acento-fuerte: #4fae7f; --acento-texto: #0b1610; --acento-suave: #1c3127;
    --grafito: #1c2722; --grafito-2: #25322b; --grafito-texto: #eef0ec; --grafito-suave: #a3aba5; --menta: #8fd3ad; --menta-texto: #0b1610;
    --arena: #2a261e; --arena-texto: #d8c9a8;
    --alerta: #ec8576; --alerta-suave: #3a2220; --ok: #5fbf8f;
    --sombra: 0 1px 0 rgba(255, 255, 255, .03);
    --vidrio: rgba(15, 19, 17, .86);
    color-scheme: dark;
  }
}
:root[data-tema="oscuro"] {
  --fondo: #0f1311; --tarjeta: #181d1a; --tarjeta-2: #1f2522; --texto: #eef0ec; --suave: #a3aba5; --tenue: #747c76; --linea: #2a312d;
  --acento: #5fbf8f; --acento-fuerte: #4fae7f; --acento-texto: #0b1610; --acento-suave: #1c3127;
  --grafito: #1c2722; --grafito-2: #25322b; --grafito-texto: #eef0ec; --grafito-suave: #a3aba5; --menta: #8fd3ad; --menta-texto: #0b1610;
  --arena: #2a261e; --arena-texto: #d8c9a8;
  --alerta: #ec8576; --alerta-suave: #3a2220; --ok: #5fbf8f;
  --sombra: 0 1px 0 rgba(255, 255, 255, .03);
  --vidrio: rgba(15, 19, 17, .86);
  color-scheme: dark;
}

/* ---------- Base ---------- */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--fondo); color: var(--texto); font: 16px/1.45 var(--f-texto); overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body { min-height: 100dvh; }
h2, h3 { text-wrap: balance; letter-spacing: -.015em; }
h2 { font-size: 22px; line-height: 1.2; margin: 0 0 12px; font-weight: 750; }
h3 { font-size: 17px; line-height: 1.3; margin: 0 0 6px; font-weight: 700; }
p { margin: 0 0 10px; }
.suave { color: var(--suave); font-size: 15px; }
.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
ul, ol { padding-left: 20px; margin: 6px 0; }
li { margin: 4px 0; }
svg.i { width: 22px; height: 22px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

/* ---------- Encabezado ---------- */
header { position: sticky; top: 0; z-index: 5; background: var(--vidrio); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 1px solid transparent; }
header h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
.usuario-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 14px 4px 4px; border-radius: 99px; border: 1px solid var(--linea);
  background: var(--tarjeta); color: var(--texto); font: 600 15px var(--f-texto); cursor: pointer; transition: transform var(--t), background var(--t); }
.usuario-btn:active { transform: scale(.97); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--acento-suave); color: var(--acento); font: 700 15px var(--f-num); }
.usuario-btn .avatar svg.i { width: 18px; height: 18px; }

/* ---------- Contenido ---------- */
main { padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(108px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
main > * { margin-bottom: 0; }
body:has(.temporizador) main { padding-bottom: calc(224px + env(safe-area-inset-bottom, 0px)); }
main.entra > * { animation: entrar 220ms cubic-bezier(.2, .7, .2, 1) both; }
main.entra > *:nth-child(2) { animation-delay: 30ms; } main.entra > *:nth-child(3) { animation-delay: 60ms; } main.entra > *:nth-child(n+4) { animation-delay: 90ms; }
@keyframes entrar { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.tarjeta { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: var(--r); padding: 16px; box-shadow: var(--sombra); }
.tarjeta > :last-child { margin-bottom: 0; }
.ceja { display: block; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--suave); margin-bottom: 6px; }
.seccion-tit { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 6px 2px -4px; }
.seccion-tit h3 { margin: 0; font-size: 18px; }
.fila { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.fila > * { flex: 1 1 auto; }
.dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dos > *, .tres > * { min-width: 0; }

/* ---------- Botones ---------- */
button { font-family: inherit; cursor: pointer; }
button.b, .b { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border-radius: 14px; border: 1px solid var(--linea);
  background: var(--tarjeta); color: var(--texto); font-size: 16px; font-weight: 650; padding: 12px 14px; text-align: center;
  transition: transform var(--t), background-color var(--t), border-color var(--t), color var(--t); }
.b:active { transform: scale(.98); }
.b.principal { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); font-size: 18px; min-height: 58px; font-weight: 700; }
.b.principal:active { background: var(--acento-fuerte); }
.b.peligro { color: var(--arena-texto); background: var(--arena); border-color: transparent; }
.b.chico { min-height: 48px; font-size: 15px; width: auto; padding: 10px 14px; }
.b.icono { width: 48px; min-width: 48px; padding: 0; color: var(--suave); }
.b.fantasma { background: transparent; border-color: transparent; color: var(--suave); }
.b:disabled { opacity: .5; }
.sel, .rir .sel { background: var(--acento); color: var(--acento-texto); border-color: var(--acento); }

/* ---------- Formularios ---------- */
input, select, textarea { width: 100%; min-height: 48px; font: inherit; font-size: 16px; color: var(--texto); background: var(--tarjeta-2); border: 1px solid var(--linea);
  border-radius: var(--r-chico); padding: 11px 12px; transition: border-color var(--t), background-color var(--t); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--acento); background-color: var(--tarjeta); }
select { appearance: none; -webkit-appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--suave) 50%), linear-gradient(135deg, var(--suave) 50%, transparent 50%);
  background-position: calc(100% - 18px) 21px, calc(100% - 13px) 21px; background-size: 5px 5px; background-repeat: no-repeat; }
textarea { min-height: 104px; resize: vertical; }
label { display: block; font-size: 14px; font-weight: 600; color: var(--suave); margin: 12px 0 6px; }
.grupo { display: flex; flex-direction: column; }
.grupo > label:first-child { margin-top: 0; }

/* ---------- Etiquetas y avisos ---------- */
.etiqueta { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--acento-suave); color: var(--acento); font-size: 13px; font-weight: 650; line-height: 1.3; }
.etiqueta.pend { background: var(--arena); color: var(--arena-texto); }
.etiqueta.neutra { background: var(--tarjeta-2); color: var(--suave); border: 1px solid var(--linea); }
.aviso { background: var(--alerta-suave); color: var(--alerta); border-radius: var(--r-chico); padding: 12px 14px; font-size: 15px; }
.info { background: var(--tarjeta); color: var(--texto); border: 1px solid var(--linea); border-left: 4px solid var(--tenue); border-radius: var(--r-chico); padding: 12px 14px; font-size: 15px; }
.ok { background: var(--acento-suave); color: var(--acento); border-radius: var(--r-chico); padding: 12px 14px; font-size: 15px; font-weight: 600; }
.nota { display: flex; gap: 10px; align-items: flex-start; background: var(--tarjeta-2); color: var(--suave); border-radius: var(--r-chico); padding: 12px; font-size: 14.5px; line-height: 1.45; }
.nota svg.i { width: 18px; height: 18px; margin-top: 1px; color: var(--acento); }
.pendientes { font-size: 14px; color: var(--suave); text-align: center; }

/* ---------- Hoy ---------- */
.saludo { padding: 8px 2px 0; }
.saludo .ceja { margin-bottom: 2px; }
.saludo h2 { font-size: 30px; margin: 0; letter-spacing: -.025em; }
.hero { background: var(--grafito); color: var(--grafito-texto); border-radius: 24px; padding: 20px 18px 18px; position: relative; overflow: hidden; box-shadow: var(--sombra); }
.hero::before { content: ""; position: absolute; inset: -40% -30% auto auto; width: 240px; height: 240px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--menta) 22%, transparent), transparent 70%); pointer-events: none; }
.hero > * { position: relative; }
.hero .ceja { color: var(--menta); }
.hero h2 { font-size: 26px; margin: 2px 0 10px; color: var(--grafito-texto); }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--grafito-suave); font-size: 14px; margin-bottom: 14px; }
.hero-meta b { color: var(--grafito-texto); font-family: var(--f-num); font-size: 16px; }
.hero-chip { display: inline-flex; padding: 3px 9px; border-radius: 99px; font-size: 12px; font-weight: 650; background: var(--grafito-2); color: var(--grafito-suave); margin-left: 6px; vertical-align: 2px; letter-spacing: 0; text-transform: none; }
.ejs { list-style: none; padding: 0; margin: 16px 0 -6px; display: flex; flex-direction: column; }
.ejs li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; margin: 0; border-top: 1px solid var(--grafito-2); }
.ejs .orden { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--grafito-2); color: var(--grafito-suave); font: 700 13px var(--f-num); }
.ejs .nom { font-weight: 600; font-size: 15.5px; line-height: 1.3; min-width: 0; }
.ejs .pres { display: block; color: var(--grafito-suave); font-size: 13.5px; font-weight: 400; margin-top: 2px; }
.ejs .carga { font: 700 16px var(--f-num); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.ejs .carga.def { font: 500 13px var(--f-texto); color: var(--grafito-suave); }
.hero .b.principal { background: var(--menta); color: var(--menta-texto); border-color: var(--menta); }
.hero .b.principal:active { background: color-mix(in srgb, var(--menta) 85%, #000); }
.hero .en-curso { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 14px; color: var(--grafito-suave); }
.hero .en-curso .barra { flex: 1; background: var(--grafito-2); }
.hero .en-curso .barra > div { background: var(--menta); }

.semana { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.anillo { position: relative; width: 76px; height: 76px; }
.anillo svg { width: 76px; height: 76px; transform: rotate(-90deg); }
.anillo .fondo-a { stroke: var(--tarjeta-2); }
.anillo .valor-a { stroke: var(--acento); transition: stroke-dashoffset 400ms cubic-bezier(.2, .7, .2, 1); }
.anillo .centro { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1; }
.anillo .centro b { font: 750 22px var(--f-num); }
.anillo .centro span { font-size: 11px; color: var(--suave); display: block; margin-top: 2px; }
.dias { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 10px; }
.dia { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: var(--tenue); font-weight: 600; }
.dia i { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.5px dashed transparent; background: var(--tarjeta-2); }
.dia.plan i { border-color: var(--tenue); background: transparent; }
.dia.hecho i { background: var(--acento); border: 0; color: var(--acento-texto); }
.dia.hecho i svg.i { width: 15px; height: 15px; stroke-width: 3; }
.dia.hoy { color: var(--texto); }
.dia.hoy i { box-shadow: 0 0 0 2px var(--fondo), 0 0 0 4px var(--acento); }

.vacio { text-align: left; padding: 22px 18px; }
.vacio .ilus { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--acento-suave); color: var(--acento); margin-bottom: 14px; }
.vacio .ilus svg.i { width: 32px; height: 32px; }
.vacio h2 { font-size: 24px; margin-bottom: 6px; }
.pasos { list-style: none; padding: 0; margin: 14px 0 18px; display: flex; flex-direction: column; gap: 10px; }
.pasos li { display: flex; gap: 12px; align-items: center; margin: 0; font-size: 15px; }
.pasos li span { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--tarjeta-2); color: var(--suave); font: 700 13px var(--f-num); flex: 0 0 auto; }

/* ---------- Sesión ---------- */
.sesion-cab { padding: 6px 2px 0; }
.sesion-cab h2 { font-size: 24px; margin: 0 0 10px; }
.progreso-ses { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--suave); }
.progreso-ses .barra { flex: 1; }
.progreso-ses b { color: var(--texto); font-family: var(--f-num); }
.barra { height: 8px; background: var(--tarjeta-2); border-radius: 6px; overflow: hidden; }
.barra > div { height: 100%; background: var(--acento); border-radius: 6px; transition: width 300ms cubic-bezier(.2, .7, .2, 1); }

.ej { padding: 0; overflow: hidden; transition: border-color var(--t), box-shadow var(--t); }
.ej.activo { border-color: color-mix(in srgb, var(--acento) 55%, var(--linea)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--acento) 35%, transparent), var(--sombra); }
.ej-cab { display: flex; align-items: center; gap: 12px; padding: 14px 10px 14px 14px; }
.ej-toca { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; cursor: pointer; min-height: 48px; }
.ej-toca > div { min-width: 0; flex: 1; }
.ej-toca h3 { margin: 0 0 3px; font-size: 16.5px; }
.ej-num { width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; background: var(--tarjeta-2); color: var(--suave); font: 700 14px var(--f-num); }
.ej.activo .ej-num { background: var(--acento); color: var(--acento-texto); }
.ej.hecho .ej-num { background: var(--acento-suave); color: var(--acento); }
.ej.hecho .ej-num svg.i { width: 18px; height: 18px; stroke-width: 3; }
.ej-pres { font-size: 13.5px; color: var(--suave); }
.marcas { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.marcas i { width: 22px; height: 6px; border-radius: 3px; background: var(--linea); }
.marcas i.si { background: var(--acento); }
.ej-cuerpo { padding: 0 14px 16px; display: flex; flex-direction: column; gap: 14px; }

.hechas { display: flex; flex-direction: column; gap: 6px; }
.hecha { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; border-radius: var(--r-chico); background: var(--acento-suave); color: var(--texto); font-size: 15px; }
.hecha .hn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--acento); color: var(--acento-texto); }
.hecha .hn svg.i { width: 16px; height: 16px; stroke-width: 3; }
.hecha b { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-size: 16px; }
.hecha .hd { color: var(--suave); font-size: 13.5px; text-align: right; }
.hecha.recien { animation: pop 420ms cubic-bezier(.2, .9, .3, 1.3) both; }
.hecha.recien .hn { animation: tilde 500ms 120ms cubic-bezier(.2, .9, .3, 1.4) both; }
@keyframes pop { 0% { opacity: 0; transform: translateY(-6px) scale(.96); } 100% { opacity: 1; transform: none; } }
@keyframes tilde { 0% { transform: scale(.4); } 70% { transform: scale(1.18); } 100% { transform: scale(1); } }

.carga-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
.campo { background: var(--tarjeta-2); border-radius: 16px; padding: 6px 6px 6px 14px; min-width: 0; display: flex; align-items: center; gap: 10px; }
.campo-tit { display: flex; flex-direction: column; width: 62px; flex: 0 0 auto; font-size: 15px; font-weight: 700; color: var(--texto); line-height: 1.2; }
.campo-tit span { font-size: 12.5px; font-weight: 500; color: var(--tenue); }
.num { display: grid; grid-template-columns: 56px 1fr 56px; gap: 6px; align-items: center; flex: 1; min-width: 0; }
.num input { min-width: 0; text-align: center; font: 750 32px var(--f-num); font-variant-numeric: tabular-nums; padding: 4px 0; min-height: 56px; background: transparent; border-color: transparent; letter-spacing: -.02em; }
.num input:focus { background-color: var(--tarjeta); border-color: var(--acento); }
.num button.b { min-height: 56px; padding: 0; font-size: 24px; font-weight: 500; border-radius: 12px; background: var(--tarjeta); flex-direction: column; gap: 0; line-height: 1; }
.num button.b small { font: 600 10.5px var(--f-num); color: var(--tenue); margin-top: 2px; }
.rir-tit { font-size: 13px; font-weight: 650; color: var(--suave); margin: 0 2px 8px; display: flex; justify-content: space-between; gap: 8px; }
.rir-tit span { font-weight: 500; color: var(--tenue); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 4px; background: var(--tarjeta-2); border-radius: 16px; }
.seg.cinco { grid-template-columns: repeat(5, 1fr); }
.seg.tres-op { grid-template-columns: repeat(3, 1fr); }
.seg button.b { min-height: 56px; border: 0; background: transparent; flex-direction: column; gap: 1px; padding: 6px 2px; border-radius: 12px; font: 750 20px var(--f-num); color: var(--texto); }
.seg button.b small { font: 500 11px var(--f-texto); color: var(--tenue); white-space: nowrap; }
.seg button.b.sel { background: var(--tarjeta); color: var(--acento); box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 1.5px var(--acento); }
.seg button.b.sel small { color: var(--acento); }
.sec { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sec .b { min-height: 48px; font-size: 15px; font-weight: 600; white-space: nowrap; gap: 6px; padding: 10px 8px; }
.sec .b svg.i { width: 18px; height: 18px; }
.panel { background: var(--tarjeta-2); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: entrar 200ms cubic-bezier(.2, .7, .2, 1) both; }
.panel h3, .panel p { margin: 0; }
.panel label { margin: 4px 0 0; }
.panel select, .panel textarea { background-color: var(--tarjeta); }

/* ---------- Temporizador ---------- */
#temp-contenedor { position: fixed; left: 0; right: 0; bottom: calc(72px + env(safe-area-inset-bottom, 0px)); z-index: 6; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.temporizador { pointer-events: auto; max-width: 576px; margin: 0 auto; background: var(--grafito); color: var(--grafito-texto); border-radius: 22px; padding: 14px 14px 14px 18px;
